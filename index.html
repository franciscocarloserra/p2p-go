<style>

    display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s;z-index:5}

  #cf{display:flex;padding:8px;gap:6px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  #cf input{flex:1;min-width:0;padding:11px;border-radius:10px;border:0;background:#000;color:#eee;font-size:16px}
  #cf button{border:0;border-radius:10px;padding:0 14px;background:#2e7d55;color:#fff;font-size:16px}
  #toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none;max-width:90vw;text-align:center}
  #toast.on{opacity:1}

  @keyframes shake{20%{transform:translateX(-12px) rotate(-2deg)}40%{transform:translateX(12px) rotate(2deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  .fly{position:fixed;bottom:20%;font-size:42px;pointer-events:none;z-index:8;animation:fly 2.2s ease-out forwards}
  @keyframes fly{to{transform:translateY(-60vh) scale(1.6);opacity:0}}
  #modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10}

</style></head><body>

<script type="module">
window.onerror = window.onunhandledrejection = e => toast('error: ' + (e.reason || e.message || e));
import {joinRoom} from './trystero-nostr.mjs?v=2026-11-02.2';
import * as G from './game.js?v=2026-11-02.2';
import {botMove} from './bot.js?v=2026-11-02.2';

const VERSION = '2026-11-02.2';

// Tunable parameters
const P = {
  appId: 'go-p2p-7b3e19',
  relayUrls: ['wss://nos.lol', 'wss://relay.primal.net', 'wss://nostr.mom'],
  randomBytes: 16,
  defaultSize: 9,
  maxPayloadBytes: 16384,
  maxChat: 100,
  maxChatLen: 200,
  maxUndo: 300,        // practice/local undo steps kept
  versionPollMs: 60000,
  toastMs: 2200,
  blipGain: 0.04,
  botMs: 600,
  aloneAskMs: 60000,    // alone in an old game this long: offer a new one
};
// UI text is English; ES maps each English string to Spanish for Spanish browsers
const ES = {
  'connecting...': 'conectando...', 'update': 'actualizar', 'count': 'contar', 'link': 'link', 'menu': 'menú', 'Menu': 'Menú', 'Undo': 'Deshacer', 'Local 2 players': 'Local 2 jugadores', 'Continue practice': 'Seguir práctica', 'Continue local': 'Seguir local',
  'Black': 'Negras', 'White': 'Blancas', 'Random': 'Al azar', 'Color vs bot': 'Color vs bot', 'Copy link': 'Copiar link', 'New game': 'Partida nueva',
  'waiting for opponent...': 'esperando rival...', 'Pass': 'Pasar', 'Accept': 'Aceptar', 'Resume': 'Seguir', 'Resign': 'Rendirse', 'tease...': 'molestar...',
  'Book1 - Excel': 'Libro1 - Excel', 'File': 'Archivo', 'Home': 'Inicio', 'Insert': 'Insertar', 'Formulas': 'Fórmulas', 'Data': 'Datos', 'Review': 'Revisar', 'fx  =SUM(B2:B14)': 'fx  =SUMA(B2:B14)',
  'send the link to your opponent': 'pasale el link a tu rival', 'taking a seat...': 'sentándose...', 'watching': 'mirando', 'your turn': 'tu turno',
  '{0}\'s turn': 'turno de {0}', ' (offline)': ' (desconectado)', 'tap dead stones, then accept': 'tocá las piedras muertas y aceptá',
  'waiting for {0} to accept': 'esperando que {0} acepte', '{0} wins by resignation': '{0} gana por abandono', '{0} wins by {1}': '{0} gana por {1}', 'draw': 'empate',
  'captures {0}': 'capturas {0}', '{0} pts': '{0} pts', 'Board size': 'Tablero', 'Bot': 'Bot',
  'Nobody here yet. Send the link to your opponent or start another game.': 'Nadie conectado todavía. Pasale el link a tu rival o empezá otra partida.',
  'Your opponent is offline. The game is saved; you can wait or start another.': 'Tu rival no está conectado. La partida sigue guardada; podés esperarlo o empezar otra.',
  'Your opponent isn\'t showing up': 'Tu rival no aparece', 'Keep waiting': 'Seguir esperando', 'Who are you?': '¿Quién sos?', 'I\'m {0}': 'Soy {0}',
  'your name': 'tu nombre', 'Play': 'Jugar', 'Online with link': 'Online con link', 'Practice vs bot': 'Práctica vs bot', 'link copied': 'link copiado',
  'Resign this game?': '¿Abandonar la partida?', 'Yes, resign': 'Sí, me rindo', 'Cancel': 'Cancelar', 'View board': 'Ver tablero', 'tap again to play': 'tocá de nuevo para jugar',
  '🐢 hurry up already': '🐢 dale que es para hoy', '😜 I\'m gonna beat you': '😜 te voy a ganar', '👉 poke': '👉 pinchar', '🤡 clown move': '🤡 jugada de payaso', '🔥 sick move': '🔥 tremenda',
  // game.js errors and log
  'you are watching': 'estás mirando', 'game is not on': 'no hay partida en juego', 'not your turn': 'no es tu turno', 'invalid move': 'jugada inválida',
  'ko: play elsewhere first': 'ko: jugá en otro lado primero', 'suicide is not allowed': 'no se permite el suicidio', 'occupied': 'ocupado', 'tap a group': 'tocá un grupo', 'not now': 'ahora no',
  '{0} plays black': '{0} juega con negras', '{0} resigned': '{0} se rindió', '{0} captured {1}': '{0} capturó {1}', '{0} passed': '{0} pasó',
  'both passed: mark dead stones': 'ambos pasaron: marcá las piedras muertas', '{0} resumed play': '{0} siguió jugando',
};
const LANG = navigator.language.startsWith('es') ? 'es' : 'en';
const fill = (k, a) => a.reduce((x, v, i) => x.replace('{' + i + '}', v), k);
const t = (k, ...a) => fill((LANG === 'es' && ES[k]) || k, a);
const TEASES = ['🐢 hurry up already', '😜 I\'m gonna beat you', '👉 poke', '💋', '😴', '🤡 clown move', '🔥 sick move', '😂'].map(x => t(x)), POKE = 2;

const $ = id => document.getElementById(id);
document.documentElement.lang = LANG;
document.querySelectorAll('#xlhead *, #bar *, #lobby button, .who span, #acts button').forEach(e => { if (!e.children.length && e.textContent) e.textContent = t(e.textContent); });
$('ct').placeholder = t('tease...');

// Online: room and password live in the URL hash #room:password (password encrypts signaling; WebRTC itself is end-to-end).
// Practice: #solo, against the bot on this device.
const rand = () => [...crypto.getRandomValues(new Uint8Array(P.randomBytes))].map(b => b.toString(16).padStart(2, '0')).join('');
const MODE = location.hash === '#solo' ? 'solo' : location.hash === '#local' ? 'local' : /^#[^:]+:.+/.test(location.hash) ? 'online' : 'menu';
const ONLINE = MODE === 'online';
addEventListener('hashchange', () => location.reload());
const [room, ...pw] = decodeURIComponent(location.hash.slice(1)).split(':');
const KEY = 'go:' + (ONLINE ? room : MODE);
if (!ONLINE) { localStorage.setItem(KEY + ':me', 'me'); $('chatBtn').style.display = $('copy').style.display = 'none'; }

// Identity is per device (localStorage), so resume works after drops, reloads and redeploys
let me = localStorage.getItem(KEY + ':me') || rand();
localStorage.setItem(KEY + ':me', me);
let myName = localStorage.getItem('go:name') || '';
let s = JSON.parse(localStorage.getItem(KEY + ':state') || 'null');
let chat = JSON.parse(localStorage.getItem(KEY + ':chat') || '[]');
let hist = ONLINE ? [] : JSON.parse(localStorage.getItem(KEY + ':hist') || '[]');
let chatOpen = false, unread = 0, ghost = -1, mouse = false, showCount = false, botT = 0, aloneTimer = 0, aloneAsked = false;

const cfg = {appId: P.appId, password: pw.join(':')};
if (P.relayUrls.length) cfg.relayConfig = {urls: P.relayUrls};
const noop = {send() {}};
const r = ONLINE ? joinRoom(cfg, room) : {getPeers: () => ({}), makeAction: () => noop};
const stAct = r.makeAction('st'), chatAct = r.makeAction('chat'), pokeAct = r.makeAction('poke');

// Local: one device, whoever's turn it is holds the seat
const seat = () => !s ? -1 : MODE === 'local' ? (s.phase === 'play' ? s.turn : 0) : s.players.findIndex(p => p.id === me);
const myTurn = () => s?.phase === 'play' && s.turn === seat();
const save = () => { localStorage.setItem(KEY + ':state', JSON.stringify(s)); localStorage.setItem(KEY + ':chat', JSON.stringify(chat)); if (!ONLINE) localStorage.setItem(KEY + ':hist', JSON.stringify(hist)); };
// whole state, highest v wins (tie: lowest id); fresh id per commit so two peers committing the same v still converge
const newer = (a, b) => !b || a.v > b.v || (a.v === b.v && a.id < b.id);
function commit() { s.v++; s.id = rand(); save(); stAct.send(JSON.stringify(s)); render(true); botTick(); }

function parse(raw) {
  if (typeof raw !== 'string' || raw.length > P.maxPayloadBytes) return null;
  try { const o = JSON.parse(raw); return o && typeof o === 'object' && !Array.isArray(o) ? o : null; } catch { return null; }
}
const int = x => Number.isInteger(x);
const valid = o => o.schema === 1 && typeof o.id === 'string' && int(o.v) && G.SIZES.includes(o.size) && typeof o.komi === 'number'
  && typeof o.board === 'string' && o.board.length === o.size ** 2 && /^[.bw]*$/.test(o.board)
  && Array.isArray(o.players) && o.players.length <= 2 && o.players.every(p => p && typeof p.id === 'string' && typeof p.name === 'string')
  && ['waiting', 'play', 'score', 'over'].includes(o.phase) && (o.turn === 0 || o.turn === 1) && int(o.ko) && int(o.last) && int(o.moves) && int(o.passes)
  && Array.isArray(o.caps) && o.caps.length === 2 && o.caps.every(int) && Array.isArray(o.dead) && o.dead.every(int)
  && Array.isArray(o.taken) && o.taken.every(int) && Array.isArray(o.ok) && o.ok.length === 2
  && (o.ev === null || Array.isArray(o.ev) && typeof o.ev[0] === 'string' && o.ev.every(x => typeof x === 'string' || int(x)))
  && (o.result === null || o.result && typeof o.result === 'object' && [-1, 0, 1].includes(o.result.winner));

// Sit down if there is a free seat; the second player to sit starts the game with random colors
function claim() {
  if (!ONLINE || !myName || !s || seat() >= 0 || s.players.length >= 2) return;
  s.players.push({id: me, name: myName});
  if (s.players.length === 2 && s.phase === 'waiting') G.begin(s, s.size, Math.random() < .5);
  commit();
}

stAct.onMessage = raw => {
  const o = parse(raw);
  if (!o || !valid(o) || !newer(o, s)) return;
  const wasMine = myTurn(), wasOver = s?.phase === 'over';
  s = o; save(); claim(); render(true);
  if (!wasMine && myTurn()) blip(660);
  if (!wasOver && s.phase === 'over') overModal();
  if (seat() < 0 && s.players.length >= 2 && !$('modal').className && s.phase !== 'over') askSeat();
};
chatAct.onMessage = raw => {
  const o = parse(raw);
  if (Array.isArray(o?.list)) return o.list.forEach(addChat);
  if (o) { addChat(o); blip(990); }
};
pokeAct.onMessage = raw => { const o = parse(raw); if (o && typeof o.e === 'string') tease(o.e.slice(0, 8), o.shake === true); };
r.onPeerJoin = peer => {
  status();
  if (s) stAct.send(JSON.stringify(s), {target: peer});
  if (chat.length) chatAct.send(JSON.stringify({list: chat}), {target: peer});
};
r.onPeerLeave = () => status();

function play(a) {
  const before = JSON.stringify(s), err = G.act(s, seat(), a);
  if (err) return toast(t(err));
  if (MODE === 'local' && a.type === 'accept') G.act(s, 1, a);
  if (!ONLINE) { hist.push(before); if (hist.length > P.maxUndo) hist.shift(); }
  ghost = -1;
  if (s.taken.length && a.type === 'play') blip(440);
  commit();
  if (s.phase === 'over') overModal();
}

// Undo (practice/local): back to the state before your last action; in practice that also takes back the bot's reply
function undo() {
  if (!hist.length) return;
  clearTimeout(botT); ghost = -1;
  const v = s.v;
  s = JSON.parse(hist.pop()); s.v = v; commit(); close();
}

// Practice: the bot moves on its turn and accepts the count as soon as you do
function botTick() {
  clearTimeout(botT);
  if (ONLINE || !s) return;
  const b = s.players.findIndex(p => p.bot);
  if (b < 0) return;
  if ((s.phase === 'play' && s.turn === b) || (s.phase === 'score' && !s.ok[b] && s.ok[1 - b])) botT = setTimeout(() => {
    if (G.act(s, b, botMove(s, b))) return;
    commit();
    if (s.phase === 'over') overModal();
    else if (myTurn()) blip(660);
  }, P.botMs);
}

// --- render
const name = q => s.players[q]?.name ?? '?';
const log = () => s?.ev ? t(...s.ev) : '';
function resultText() {
  const res = s.result;
  if (!res) return '';
  if (res.by === 'resign') return t('{0} wins by resignation', name(res.winner));
  return (res.winner < 0 ? t('draw') : t('{0} wins by {1}', name(res.winner), Math.abs(res.b - res.w))) + ` (B ${res.b} · W ${res.w})`;
}
function status() {
  const peers = Object.keys(r.getPeers()).length;
  $('dot').className = peers || !ONLINE ? 'on' : '';
  let msg;
  if (!s || s.phase === 'waiting') msg = t(peers ? 'taking a seat...' : 'send the link to your opponent');
  else if (s.phase === 'over') msg = resultText();
  else if (s.phase === 'score') msg = seat() >= 0 && s.ok[seat()] ? t('waiting for {0} to accept', name(1 - seat())) : t('tap dead stones, then accept');
  else if (seat() < 0) msg = t('watching');
  else if (MODE === 'local') msg = t('{0}\'s turn', name(s.turn)) + (log() ? ' · ' + log() : '');
  else msg = (myTurn() ? t('your turn') : t('{0}\'s turn', name(s.turn)) + (peers || !ONLINE ? '' : t(' (offline)'))) + (log() ? ' · ' + log() : '');
  $('status').textContent = msg;
  const alone = ONLINE && !peers, playing = s && s.phase !== 'waiting';
  $('lobby').className = alone ? 'on' : '';
  if (!alone || !playing) clearTimeout(aloneTimer), aloneTimer = 0;
  else if (!aloneTimer && !aloneAsked) aloneTimer = setTimeout(askAlone, P.aloneAskMs);
  $('lobbyT').textContent = t(!playing ? 'Nobody here yet. Send the link to your opponent or start another game.'
    : 'Your opponent is offline. The game is saved; you can wait or start another.');
}

const stars = N => {
  const a = N === 9 ? [2, 6] : N === 13 ? [3, 9] : [3, 9, 15], c = (N - 1) / 2, out = [];
  for (const y of a) for (const x of a) out.push([x, y]);
  return N === 19 ? out : [...out, [c, c]];
};
function drawBoard(anim) {
  const N = s.size, L = N + 1, counting = s.phase === 'score' || s.phase === 'over' && s.result?.by === 'score' || showCount && s.phase === 'play';
  const sc = counting ? G.score(s, s.phase === 'play' ? [] : s.dead) : null, dead = new Set(s.phase === 'play' ? [] : s.dead);
  let h = `<defs><radialGradient id="gb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#666"/><stop offset=".5" stop-color="#111"/><stop offset="1" stop-color="#000"/></radialGradient>`
    + `<radialGradient id="gw" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#ddd"/><stop offset="1" stop-color="#999"/></radialGradient></defs>`
    + `<rect class="wood" width="${L}" height="${L}" rx=".3"/>`;
  for (let k = 1; k <= N; k++) h += `<line x1="1" y1="${k}" x2="${N}" y2="${k}"/><line x1="${k}" y1="1" x2="${k}" y2="${N}"/>`;
  for (const [x, y] of stars(N)) h += `<circle class="star" cx="${x + 1}" cy="${y + 1}" r=".11"/>`;
  for (let i = 0; i < N * N; i++) {
    const c = s.board[i], x = i % N + 1, y = Math.floor(i / N) + 1;
    if (c !== '.') h += `<circle class="st ${c}${dead.has(i) ? ' dead' : ''}" cx="${x}" cy="${y}" r=".47"/>`;
    if (sc?.own[i]) h += `<rect class="t ${sc.own[i]}" x="${x - .16}" y="${y - .16}" width=".32" height=".32"/>`;
  }
  if (s.last >= 0 && s.board[s.last] !== '.') h += `<circle class="lm ${s.board[s.last]}" cx="${s.last % N + 1}" cy="${Math.floor(s.last / N) + 1}" r=".2"/>`;
  if (anim) for (const i of s.taken) h += `<circle class="gone" cx="${i % N + 1}" cy="${Math.floor(i / N) + 1}" r=".4"/>`;
  if (ghost >= 0 && myTurn() && s.board[ghost] === '.') h += `<circle class="st ${'bw'[seat()]} ghost" cx="${ghost % N + 1}" cy="${Math.floor(ghost / N) + 1}" r=".47"/>`;
  $('board').setAttribute('viewBox', `0 0 ${L} ${L}`);
  $('board').innerHTML = h;
  return sc;
}

function render(anim) {
  status();
  const sat = seat() >= 0, playing = s && (s.phase === 'play' || s.phase === 'score');
  for (const [id, on] of [['bPass', s?.phase === 'play' && sat], ['bAccept', s?.phase === 'score' && sat], ['bResume', s?.phase === 'score' && sat],
    ['bNew', s?.phase === 'over' && sat], ['bResign', playing && sat], ['bUndo', !ONLINE && hist.length && s.phase !== 'waiting']]) $(id).style.display = on ? '' : 'none';
  $('bPass').disabled = !myTurn();
  $('bAccept').disabled = !!(s && sat && s.ok[seat()]);
  $('count').className = 'pill' + (showCount ? ' on' : '');
  if (!s) return;
  const sc = drawBoard(anim), p = MODE === 'local' ? 0 : Math.max(0, seat()), o = 1 - p;
  const side = (q, nm, sEl, wEl) => {
    const dot = Object.assign(document.createElement('i'), {className: 'bw'[q]});
    $(nm).replaceChildren(dot, s.players[q] ? name(q) : t('waiting for opponent...'));
    $(sEl).textContent = sc ? t('{0} pts', q ? sc.w : sc.b) : t('captures {0}', s.caps[q]);
    $(wEl).classList.toggle('turn', s.phase === 'play' && s.turn === q);
  };
  side(p, 'meN', 'meS', 'meW'); side(o, 'oppN', 'oppS', 'oppW');
}

// Pointer: mouse hovers a ghost stone and clicks to play; touch taps once to place the ghost, again on it to play
const pt = e => {
  const m = $('board').getScreenCTM();
  if (!m || !s) return -1;
  const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse()), N = s.size, x = Math.round(q.x) - 1, y = Math.round(q.y) - 1;
  return x >= 0 && y >= 0 && x < N && y < N ? y * N + x : -1;
};
addEventListener('pointerdown', e => mouse = e.pointerType === 'mouse', true);
$('board').onpointermove = e => { if (e.pointerType !== 'mouse' || !myTurn()) return; const i = pt(e); if (i !== ghost) { ghost = i; drawBoard(); } };
$('board').onpointerleave = e => { if (e.pointerType === 'mouse' && ghost >= 0) { ghost = -1; drawBoard(); } };
$('board').onclick = e => {
  const i = pt(e);
  if (i < 0 || !s || seat() < 0) return;
  if (s.phase === 'score') return s.board[i] !== '.' && play({type: 'dead', i});
  if (s.phase !== 'play') return;
  if (!myTurn()) return toast(t('not your turn'));
  if (mouse || ghost === i) play({type: 'play', i});
  else if (s.board[i] === '.') { ghost = i; drawBoard(); }
};
addEventListener('resize', () => render());

// --- chat (same as burako)
function addChat(m) {
  if (typeof m?.id !== 'string' || typeof m.text !== 'string' || typeof m.from !== 'string' || chat.some(c => c.id === m.id)) return;
  chat.push({id: m.id, from: m.from.slice(0, 30), by: String(m.by ?? ''), text: m.text.slice(0, P.maxChatLen), ts: +m.ts || 0});
  chat.sort((a, b) => a.ts - b.ts);
  while (chat.length > P.maxChat) chat.shift();
  if (!chatOpen && m.by !== me) unread++;
  save(); renderChat();
}
function renderChat() {
  $('msgs').replaceChildren(...chat.map(m => {
    const d = document.createElement('div');
    d.className = 'm' + (m.by === me ? ' me' : '');
    d.textContent = (m.by === me ? '' : m.from + ': ') + m.text;
    return d;
  }));
  $('msgs').scrollTop = $('msgs').scrollHeight;
  $('unread').textContent = unread;
  $('unread').style.display = unread ? 'block' : 'none';
  const last = chat.at(-1);
  if (!chatOpen && last && last.by !== me && Date.now() - last.ts < 5000) toast(last.from + ': ' + last.text);
}
function sendChat(text) {
  const m = {id: rand(), from: myName, by: me, text, ts: Date.now()};
  addChat(m); chatAct.send(JSON.stringify(m));
}
$('teases').append(...TEASES.map((x, i) => {
  const b = Object.assign(document.createElement('button'), {textContent: x});
  b.onclick = () => {
    const e = [...x][0], shake = i === POKE;
    tease(e, false); pokeAct.send(JSON.stringify({e, shake}));
    if (!shake && x.length > 2) sendChat(x);
  };
  return b;
}));
$('cf').onsubmit = e => { e.preventDefault(); const v = $('ct').value.trim(); if (v) sendChat(v); $('ct').value = ''; };
$('chatBtn').onclick = () => { chatOpen = !chatOpen; $('chat').classList.toggle('open', chatOpen); if (chatOpen) unread = 0; renderChat(); };
document.querySelector('main').addEventListener('click', () => { if (chatOpen) $('chatBtn').onclick(); }, true);

// --- modals
const btn = (label, fn, cls = '') => Object.assign(document.createElement('button'), {textContent: label, className: cls, onclick: fn});
const bold = text => Object.assign(document.createElement('b'), {textContent: text});
const show = (...els) => { $('mbody').replaceChildren(...els); $('modal').className = 'on'; };
const close = () => $('modal').className = '';
const sizePref = () => +localStorage.getItem('go:size') || P.defaultSize;
const colorPref = () => localStorage.getItem('go:color') || 'r';
const colorSwap = () => ({b: false, w: true})[colorPref()] ?? Math.random() < .5;
function picker(key, opts, cur) {
  const row = document.createElement('div'); row.className = 'sizes';
  const paint = () => [...row.children].forEach(b => b.classList.toggle('on', b.dataset.v === String(cur())));
  row.append(...opts.map(([v, label]) => Object.assign(btn(label, () => { localStorage.setItem(key, v); paint(); }, 'alt'), {dataset: {v}})));
  paint();
  return row;
}
const sizePicker = () => picker('go:size', G.SIZES.map(n => [n, `${n}×${n}`]), sizePref);
const colorPicker = () => picker('go:color', [['b', t('Black')], ['w', t('White')], ['r', t('Random')]], colorPref);
// Practice/local start fresh from the menu; an unfinished one gets a "Continue" button
const savedGame = m => { const o = JSON.parse(localStorage.getItem('go:' + m + ':state') || 'null'); return o && o.phase !== 'over' ? o : null; };
function newGame(m) {
  if (m === 'online') return location.hash = rand() + ':' + rand();
  localStorage.removeItem('go:' + m + ':state'); localStorage.removeItem('go:' + m + ':hist');
  if (MODE === m) location.reload(); else location.hash = m;
}
function menu() {
  const cont = [['solo', 'Continue practice'], ['local', 'Continue local']].filter(([m]) => m !== MODE && savedGame(m))
    .map(([m, label]) => btn(t(label), () => location.hash = m, 'alt'));
  show(Object.assign(document.createElement('div'), {className: 'title', textContent: '囲碁 go'}), bold(t('Board size')), sizePicker(),
    btn(t('Online with link'), () => newGame('online')), btn(t('Practice vs bot'), () => newGame('solo')), btn(t('Local 2 players'), () => newGame('local')),
    bold(t('Color vs bot')), colorPicker(), ...cont, ...(MODE === 'menu' ? [] : [btn(t('Cancel'), close, 'alt')]));
}
function askName() {
  const i = Object.assign(document.createElement('input'), {placeholder: t('your name'), maxLength: 20});
  const go = () => { const n = i.value.trim(); if (!n) return; myName = n; localStorage.setItem('go:name', n); close(); start(); };
  i.onkeydown = e => { if (e.key === 'Enter') go(); };
  show(Object.assign(document.createElement('div'), {className: 'title', textContent: '囲碁'}), i, btn(t('Play'), go));
  i.focus();
}
// Seat taken by someone else: let a device that lost its storage take over a seat
function askSeat() {
  show(bold(t('Who are you?')), ...s.players.map(p => btn(t('I\'m {0}', p.name), () => {
    me = p.id; myName = p.name; localStorage.setItem(KEY + ':me', me); localStorage.setItem('go:name', myName); close(); render();
  })), btn(t('watching'), close, 'alt'));
}
function askAlone() {
  if ($('modal').className) return aloneTimer = setTimeout(askAlone, P.aloneAskMs);
  aloneAsked = true;
  show(bold(t('Your opponent isn\'t showing up')), btn(t('New game'), () => location.hash = rand() + ':' + rand()), btn(t('Keep waiting'), close, 'alt'));
}
function overModal() {
  // online rematch swaps colors; practice uses the color setting; local keeps Black/White seats
  const again = btn(t('New game'), () => {
    close(); hist = [];
    if (MODE === 'solo') { s.players.sort((a, b) => !!a.bot - !!b.bot); G.begin(s, sizePref(), colorSwap()); }
    else G.begin(s, sizePref(), ONLINE);
    commit();
  });
  show(bold(resultText()), sizePicker(), ...(seat() >= 0 ? [again] : []), ...(hist.length ? [btn(t('Undo'), undo, 'alt')] : []),
    btn(t('Menu'), menu, 'alt'), btn(t('View board'), close, 'alt'));
}
$('modal').onclick = e => { if (e.target === $('modal') && s && MODE !== 'menu' && myName) close(); };

// --- actions
$('bPass').onclick = () => play({type: 'pass'});
$('bAccept').onclick = () => play({type: 'accept'});
$('bResume').onclick = () => play({type: 'resume'});
$('bNew').onclick = overModal;
$('bResign').onclick = () => show(bold(t('Resign this game?')), btn(t('Yes, resign'), () => { close(); play({type: 'resign'}); }), btn(t('Cancel'), close, 'alt'));
$('count').onclick = () => { showCount = !showCount; render(); };
$('copy').onclick = async () => { await navigator.clipboard.writeText(location.href); toast(t('link copied')); };
$('lCopy').onclick = () => $('copy').onclick();
$('lNew').onclick = () => location.hash = rand() + ':' + rand();
$('home').onclick = menu;
$('bUndo').onclick = undo;
$('upd').onclick = () => location.reload();
setInterval(async () => {
  try { const v = (await (await fetch('version.txt', {cache: 'no-store'})).text()).trim(); if (v && v !== VERSION) $('upd').style.display = 'inline'; } catch {}
}, P.versionPollMs);

// --- misc
let ac, toastT;
addEventListener('pointerdown', () => { ac ??= new AudioContext(); ac.resume(); });
function blip(f) {
  if (!ac || ac.state !== 'running' || document.body.classList.contains('xl')) return;
  const os = ac.createOscillator(), g = ac.createGain(), tm = ac.currentTime;
  os.frequency.value = f; g.gain.setValueAtTime(P.blipGain, tm); g.gain.exponentialRampToValueAtTime(0.0001, tm + .12);
  os.connect(g).connect(ac.destination); os.start(tm); os.stop(tm + .12);
}
function tease(e, shake) {
  if (document.body.classList.contains('xl')) return;
  const d = Object.assign(document.createElement('div'), {className: 'fly', textContent: e});
  d.style.left = 15 + Math.random() * 70 + 'vw';
  document.body.append(d); setTimeout(() => d.remove(), 2300);
  if (shake) { document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); navigator.vibrate?.(200); blip(330); }
}
function toast(m) { $('toast').textContent = m; $('toast').className = 'on'; clearTimeout(toastT); toastT = setTimeout(() => $('toast').className = '', P.toastMs); }
const stealth = on => {
  document.body.classList.toggle('xl', on);
  document.title = on ? t('Book1 - Excel') : 'go';
  localStorage.setItem('go:xl', on ? '1' : '');
};
stealth(!!localStorage.getItem('go:xl'));
$('xl').onclick = () => stealth(!document.body.classList.contains('xl'));
addEventListener('keydown', e => { if (e.key === 'Escape') stealth(!document.body.classList.contains('xl')); });
setInterval(status, 3000);

function start() {
  if (!s && MODE === 'local') {
    s = G.newState(rand(), sizePref(), {id: 'b', name: t('Black')});
    s.players.push({id: 'w', name: t('White')});
    G.begin(s, s.size, false); hist = []; save();
  }
  if (!s && !ONLINE) {
    s = G.newState(rand(), sizePref(), {id: me, name: myName});
    s.players.push({id: 'bot', name: t('Bot'), bot: true});
    G.begin(s, s.size, colorSwap()); hist = []; save();
  }
  if (!s) { s = G.newState(rand(), sizePref(), {id: me, name: myName}); save(); stAct.send(JSON.stringify(s)); }
  claim(); render(); renderChat(); botTick();
  if (s.phase === 'over') overModal();
}

if (MODE === 'menu') { render(); menu(); }
else if (!myName && MODE !== 'local') askName();
else { start(); if (ONLINE && seat() < 0 && s.players.length >= 2 && s.phase !== 'over') askSeat(); }
</script></body></html>
